on: [push, pull_request]

name: CI

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, target: 'aarch64-unknown-linux-gnu' }
          - { os: ubuntu-latest, target: 'armv7-unknown-linux-gnueabihf' }
          - { os: ubuntu-latest, target: 'x86_64-unknown-linux-gnu' }
          - { os: ubuntu-latest, target: 'x86_64-pc-windows-gnu' }
          - { os: ubuntu-latest, target: 'wasm32-unknown-unknown' }
          - { os: macos-latest, target: 'x86_64-apple-darwin' }
          - { os: macos-latest, target: 'aarch64-apple-darwin' }
          - { os: macos-latest, target: 'aarch64-apple-ios' }
          - { os: macos-latest, target: 'x86_64-apple-ios' }
          - { os: windows-latest, target: 'x86_64-pc-windows-msvc' }
        include:
          - os: ubuntu-latest
            packages: libx11-dev libxi-dev libgl1-mesa-dev gcc-mingw-w64

    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}
      - name: Workaround MinGW issue # https://github.com/rust-lang/rust/issues/47048
        if: runner.os == 'Linux' && matrix.config.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo cp /usr/x86_64-w64-mingw32/lib/dllcrt2.o  ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-pc-windows-gnu/lib/dllcrt2.o
          sudo cp /usr/x86_64-w64-mingw32/lib/crt2.o  ~/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-pc-windows-gnu/lib/crt2.o
          echo "[target.x86_64-pc-windows-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"/usr/bin/x86_64-w64-mingw32-gcc\"" >> ~/.cargo/config.toml
      - name: Setup aarch64
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt install gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml
      - name: Setup armv7
        if: matrix.config.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt install gcc-arm-linux-gnueabihf
          echo "[target.armv7-unknown-linux-gnueabihf]" >> ~/.cargo/config.toml
          echo "linker = \"arm-linux-gnueabihf-gcc\"" >> ~/.cargo/config.toml

      - name: Build
        run: cargo build --all-targets --target=${{ matrix.config.target }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test
      - name: Run tests with log-impl
        run: cargo test --features log-impl

  # The unit tests are pure logic (no window/GPU needed), so they can
  # run on desktop runners even though the platform backends
  # themselves need real hardware. The macOS run additionally executes
  # the Metal backend's unit tests, which other runners only compile.
  test-cross:
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Linux)
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-pc-windows-gnu,wasm32-unknown-unknown,aarch64-linux-android
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # `clippy` compiles only the host target by default, so platform
      # backends (Metal, Win32, WebGL, EGL) never got linted. None of
      # these link — check-only — so they need no SDKs or system libs.
      - name: clippy (cross-target)
        run: |
          for target in aarch64-apple-darwin x86_64-pc-windows-gnu wasm32-unknown-unknown aarch64-linux-android; do
            cargo clippy --target $target --all-targets -- -D warnings
          done

  android:
    name: Android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `cargo check` needs no NDK/SDK (nothing is linked). The old
      # `cargo quad-apk build` job is gone: cargo-quad-apk links a cargo
      # library too old to parse edition-2024 manifests, and there is no
      # newer release.
      - name: Check
        run: cargo check --target ${{ matrix.target }}

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Packages the quad_android example into a signed, installable APK
      # using the SDK build-tools preinstalled on the runner.
      - name: Build example APK
        run: extras/android/build_apk.sh
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: quad_android-apk
          path: target/android/quad_android.apk

  msrv:
    name: MSRV Check (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Verify MSRV
        # Only the library: dev-dependencies (examples/tests) may require newer rustc.
        run: cargo check
